name: Docker image

# Builds the Docker image for every pull request and push, to check it still builds.
# From master and v* tags it also pushes the image:
#  - to the GitHub Container Registry (ghcr.io), always
#  - to Amazon ECR, once the AWS_ROLE_ARN, AWS_REGION and ECR_REPOSITORY repository variables
#    are set - see "Publishing the Docker image" in README.md.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # to push to ghcr.io
  id-token: write  # to get an OIDC token to assume the AWS role

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
      PUSH_ECR: ${{ vars.AWS_ROLE_ARN != '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: env.PUSH_ECR == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUSH_ECR == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Work out image names
        id: images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          {
            echo 'names<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$ECR_REGISTRY" ]; then echo "$ECR_REGISTRY/$ECR_REPOSITORY"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.names }}
          tags: |
            type=sha
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - name: Build, and push from master and tags
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
